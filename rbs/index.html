<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RBS Budget</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply privacy mode + sidebar state before first paint so nothing flashes on navigation.
    try { if (localStorage.getItem('rbs_privacy_mode') === '1') document.documentElement.classList.add('privacy-mode'); } catch (e) {}
    try { if (localStorage.getItem('rbs_sidebar_collapsed') === '1') document.documentElement.classList.add('sidebar-collapsed'); } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <div class="boot">Loading…</div>
  </div>
  <script src="js/vendor/chart.umd.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
