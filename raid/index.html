<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAID Log</title>
<link rel="icon" type="image/png" href="raid_log_icon.png" />
<link rel="apple-touch-icon" href="raid_log_icon.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><img class="logo" src="raid_log_icon.png" alt="RAID Log" /> RAID Log</div>
    <div class="nav-section">Views</div>
    <button class="nav-item" data-nav="board"><span>▦</span> Board</button>
    <button class="nav-item" data-nav="list"><span>≡</span> List</button>
    <button class="nav-item" data-nav="matrix"><span>▨</span> Risk Matrix</button>
    <div class="nav-section">By type</div>
    <button class="nav-item" data-nav="type:Risk"><span class="dot type-dot Risk"></span> Risks <span class="count" data-count="Risk"></span></button>
    <button class="nav-item" data-nav="type:Action"><span class="dot type-dot Action"></span> Actions <span class="count" data-count="Action"></span></button>
    <button class="nav-item" data-nav="type:Issue"><span class="dot type-dot Issue"></span> Issues <span class="count" data-count="Issue"></span></button>
    <button class="nav-item" data-nav="type:Decision"><span class="dot type-dot Decision"></span> Decisions <span class="count" data-count="Decision"></span></button>
    <div class="nav-section">Personal</div>
    <button class="nav-item" data-nav="taskboard"><span class="dot type-dot Task"></span> Tasks <span class="count" data-count="Task"></span></button>
    <button class="nav-item" data-nav="tasklist"><span>≡</span> Task list</button>
    <div class="nav-section">Data</div>
    <button class="nav-item" id="settingsBtn"><span>⚙</span> Settings &amp; data</button>
    <input type="file" id="restoreInput" accept="application/json,.json" class="hidden">
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="viewTitle">Board</h1>
      <div class="spacer"></div>
      <button class="btn icon" id="hdrBackup" title="Download backup (.json)" aria-label="Download backup"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
      <button class="btn icon" id="hdrRestore" title="Load backup (.json)" aria-label="Load backup"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg></button>
      <button class="btn subtle" id="toggleDash">Hide summary</button>
      <button class="btn primary" id="createBtn">+ Create</button>
    </header>
    <div class="content">
      <div class="dash" id="dash"></div>
      <div class="filters" id="filters"></div>
      <div id="view"></div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
