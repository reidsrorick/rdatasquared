<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="clock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- App background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>

  <!-- Timesheet card -->
  <g filter="url(#shadow)">
    <rect x="104" y="84" width="264" height="308" rx="30" fill="#FFFFFF"/>
  </g>

  <!-- Card header bar -->
  <rect x="140" y="128" width="140" height="26" rx="13" fill="#4F46E5"/>

  <!-- Timesheet rows -->
  <g fill="#C7D2FE">
    <rect x="140" y="188" width="192" height="20" rx="10"/>
    <rect x="140" y="234" width="192" height="20" rx="10"/>
    <rect x="140" y="280" width="128" height="20" rx="10"/>
  </g>

  <!-- Clock badge -->
  <g filter="url(#shadow)">
    <circle cx="372" cy="372" r="92" fill="url(#clock)"/>
    <circle cx="372" cy="372" r="92" fill="none" stroke="#FFFFFF" stroke-width="12"/>
  </g>
  <!-- Clock hands (approx 10:10) -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
    <line x1="372" y1="372" x2="372" y2="318" stroke-width="14"/>
    <line x1="372" y1="372" x2="412" y2="392" stroke-width="14"/>
  </g>
  <circle cx="372" cy="372" r="11" fill="#FFFFFF"/>
</svg>
